name: PHP Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
          extensions: gd, exif

      - name: Lint all PHP files (php -l)
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            php -l "$f"
          done

      - name: Run test suite (tests/run.php)
        run: php tests/run.php

  build-zip:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        run: bash bin/build-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: optisnap-zip
          path: optisnap.zip
